<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FINCH">
  <title>FINCH</title>
  <!--
    FINCH 심볼. 원본 PNG(1254x1254)의 픽셀을 떠서 색과 도형 위치를 재고 그 값으로
    벡터를 새로 그렸다. 원본을 그대로 넣거나 base64 로 감싸면 확장자만 SVG 이고
    알맹이는 래스터라 탭 크기(16~32px)에서 뭉개진다.

    좌표계는 판을 0~64 로 둔 것이다. 실측값(판 기준 0~1):
      판 모서리 반지름 0.247  ·  판 #1E202A  ·  글리프 #FCFCFC
      반짝임 x 0.245~0.358 y 0.260~0.375
      노트북 x 0.109~0.528 y 0.517~0.763
      참새   x 0.344~0.906 y 0.357~0.753
  -->
  <rect width="64" height="64" rx="15.8" fill="#1E202A" />
  <g fill="#FCFCFC">
    <!-- 반짝임. 네 갈래가 오목해서 별이 아니라 빛으로 읽힌다. -->
    <path d="M19.3 16.6c.5 2.4 1.3 3.2 3.6 3.7-2.3.5-3.1 1.3-3.6 3.7-.5-2.4-1.3-3.2-3.6-3.7 2.3-.5 3.1-1.3 3.6-3.7Z" />
    <!-- 노트북 화면. 아래로 갈수록 오른쪽으로 눕는 평행사변형이다. -->
    <path d="M7.9 33.5h13.3l3.9 13.1H10.8L7 34.7a.95.95 0 0 1 .9-1.2Z" />
    <!-- 노트북 바닥. 앞쪽으로 얇게 깔린다. -->
    <path d="M11.2 47h15.1l7.9 1.3-14.5 1.1z" />
    <!--
      참새. 부리 끝에서 시작해 머리 위 · 등 · 갈라진 꼬리 · 배 · 가슴을 돌아
      부리 아래로 닫는 한 획이다. 꼬리 갈라짐은 직선 세 개로 둔다 — 작은 크기에서
      곡선으로 두면 뭉개져 그냥 뭉툭한 덩어리가 된다.
    -->
    <path d="M22 29.6 27.2 27.2C28.3 24.6 30.6 22.9 33.2 22.9 36.2 22.9 38.8 25.1 39.7 28.1 43.4 29.4 46.6 31.3 49.2 33.2L58 34.3 53.8 35.6 57 37.2C52.6 39.3 48.6 41.6 44.4 43.2 40.6 44.6 36 44.8 32.4 43 28.4 41 26 37.2 26 33 26 31.9 26.2 31.2 26.6 30.4L27.4 30.9Z" />
    <!-- 다리와 발. 16px 에서는 사라지지만 32px 이상에서 보인다. -->
    <path d="M35.1 42.6h1.6v3.9l2.4 1.4-3.2-.6-2.9.9 2.1-1.7zM42.6 42.4h1.6v3.9l2.4 1.4-3.2-.6-2.9.9 2.1-1.7z" />
  </g>
</svg>
